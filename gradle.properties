# Project-wide Gradle settings
# 4G heap: R8 on release flavors (POI + ML Kit) OOMs at 2G
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Version Management
# Update these values for each release
VERSION_CODE=220
VERSION_NAME=1.3.220

# F-Droid static version properties (must be static, not env vars)
APP_VERSION_CODE=220
APP_VERSION_NAME=1.3.220

# Enable R8 full mode
android.enableR8.fullMode=true
